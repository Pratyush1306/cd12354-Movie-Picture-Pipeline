name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.14.2'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.14.2'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false

  build:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          MOVIE_API_URL: ${{ secrets.FRONTEND_API_URL }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$MOVIE_API_URL" \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

  deploy:
    name: Deploy Frontend to EKS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Update frontend image
        working-directory: frontend/k8s
        run: |
          kustomize edit set image frontend=${{ secrets.ECR_REGISTRY }}/${{ secrets.FRONTEND_ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy frontend
        working-directory: frontend/k8s
        run: |
          kustomize build | kubectl apply -f -

      - name: Verify frontend deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=180s
